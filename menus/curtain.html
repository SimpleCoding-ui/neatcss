<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Curtain menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/normalize.css">
  <link rel="stylesheet" href="../css/neat.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet" />
  <script type="text/javascript" src="../js/neat.js"></script>
</head>

<body>
  <div class="nt">
    <header>
      <a href=""><h4>Curtain menu (demo)</h4></a>
      <div class="nt-menu-curtain">
        <div class="nt-menu-button">
          <i id="menu-button-curtain" class="fa-solid fa-bars" onclick="displayCurtainMenu(this)"></i>
        </div>
        <div class="nt-menu-content">
          <i class="fa-solid fa-xmark close nt-menu-item" onclick="closeCurtainMenu(this)"></i>
          <div class="nt-item-container">
            <a href="" class="nt-menu-item">Link 1</a>
            <a href="" class="nt-menu-item">Link 2</a>
            <a href="" class="nt-menu-item">Link 3</a>
          </div>
        </div>
      </div>
    </header>
    Page content here.
  </div>
</body>
</html>
